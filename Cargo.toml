[workspace]
resolver = "2"
members = [
    # the engine
    "crates/omg-core",
    "crates/omg-dsp",
    "crates/omg-gpu",
    "crates/omg-audio",
    "crates/omg-godot",
    # the demos: the town's layout, the offline renderer, the web demo
    "demo/scene",
    "demo/app",
    "demo/web/wasm",
]

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
