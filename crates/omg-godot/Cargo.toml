[package]
name = "omg-godot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
# rlib too: the host code (src/backend/, no Godot types) is unit-tested
# with plain `cargo test -p omg-godot --lib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# the engine; `gpu`: the v3 ray walk on the GPU (wgpu), CPU fallback
omg-audio = { path = "../omg-audio", features = ["gpu"] }
omg-dsp = { path = "../omg-dsp" }
# experimental-threads: the output stream's mix() runs on Godot's audio
# thread (thread-safe instance storage for those objects)
godot = { version = "0.5", features = ["experimental-threads"] }
# clip decoding: Ogg (Vorbis, FLAC), FLAC and WAV via symphonia; Ogg Opus
# via a pure-Rust Opus decoder (symphonia ships no Opus codec)
symphonia = { version = "0.6", default-features = false, features = ["ogg", "flac", "vorbis", "wav", "pcm"] }
opus-decoder = "0.1"
