[package]
name = "omg-godot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
# rlib too: the host code (src/backend/, no Godot types) is unit-tested
# with plain `cargo test -p omg-godot --lib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
omg-audio = { path = "../omg-audio" }
omg-dsp = { path = "../omg-dsp" }
# experimental-threads: the output stream's mix() runs on Godot's audio
# thread (thread-safe instance storage for those objects)
godot = { version = "0.5", features = ["experimental-threads"] }
# clip decoding: Ogg (Vorbis, FLAC), FLAC and WAV via symphonia; Ogg Opus
# via a pure-Rust Opus decoder (symphonia ships no Opus codec)
symphonia = { version = "0.6", default-features = false, features = ["ogg", "flac", "vorbis", "wav", "pcm"] }
opus-decoder = "0.1"

# native: the engine with `gpu` (the v3 ray walk on the GPU via wgpu, CPU
# fallback)
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
omg-audio = { path = "../omg-audio", features = ["gpu"] }

# the web build (wasm32-unknown-emscripten, tools/build_godot_web.sh): the
# walk stays on the CPU; gdext's wasm support, with 32-bit bindings
# generated from the installed Godot (api-custom, GODOT4_BIN)
[target.'cfg(target_os = "emscripten")'.dependencies]
godot = { version = "0.5", features = ["experimental-threads", "experimental-wasm", "api-custom"] }
